name: Docker image

# ایمیج CardPay رو می‌سازه و روی GHCR می‌ذاره: ghcr.io/<owner>/cardpay:latest
# (همون IMAGE_PREFIX ریپوی thea_deploy). بعد از push روی main خودکار اجرا می‌شه.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cardpay" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: PHP lint
        run: |
          docker run --rm -v "$PWD":/app -w /app php:8.2-cli php bin/lint.php

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # آپدیت خودکار روی سرور (اختیاری): اگه Secretهای SERVER_* رو توی همین ریپو بذاری
      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_SSH_KEY" ]; then
            echo "SERVER_* تنظیم نشده؛ آپدیت روی سرور دستی: docker compose pull cardpay && docker compose up -d cardpay"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          ssh "$SERVER_USER@$SERVER_HOST" \
            "cd ~/thea_deploy && docker compose pull cardpay && docker compose up -d cardpay && docker image prune -f"
